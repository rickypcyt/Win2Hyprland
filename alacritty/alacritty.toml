# Alacritty: misma apariencia que wezterm\wezterm.lua (traducción de kitty.conf)
# Archivo real: C:\Users\ricar\Win2Hyprland\alacritty\alacritty.toml
# (%APPDATA%\alacritty es un junction a Win2Hyprland\alacritty)
# Alacritty recarga este archivo automáticamente al guardarlo.
#
# Diferencias con WezTerm: Alacritty no tiene pestañas, divisiones ni menú
# de shells (Ctrl+Shift+L). Para eso: varias ventanas + GlazeWM.

[general]
live_config_reload = true
working_directory = 'C:\Users\ricar'   # carpeta inicial (comillas simples: sin escapes)

# ---------- Shell ----------
# PowerShell 7, empezando en C:\Users\ricar.
# Para zsh de WSL Arch en su lugar:
#   program = "wsl.exe"
#   args = ["-d", "archlinux", "-u", "ricky", "--cd", "/mnt/c/Users/ricar"]
[terminal.shell]
program = "pwsh.exe"
# Sin perfil (-NoProfile): ejecutar cualquier archivo .ps1 al arrancar cuesta ~+600 ms
# (política de ejecución + escaneo de Defender). La config del ls de Arch va aquí en
# -Command (~+100 ms). Debe ser lo mismo que powershell/profile.ps1 (que se usa al abrir
# PowerShell desde otros sitios).
args = ["-NoLogo", "-NoProfile", "-NoExit", "-Command", '''$env:LS_COLORS='rs=0:di=01;34:ln=01;36:mh=00:pi=40;33:so=01;35:do=01;35:bd=40;33;01:cd=40;33;01:or=40;31;01:mi=00:su=37;41:sg=30;43:ca=30;41:tw=30;42:ow=34;42:st=37;44:ex=01;32:*.tar=01;31:*.tgz=01;31:*.arc=01;31:*.arj=01;31:*.taz=01;31:*.lha=01;31:*.lz4=01;31:*.lzh=01;31:*.lzma=01;31:*.tlz=01;31:*.txz=01;31:*.tzo=01;31:*.t7z=01;31:*.zip=01;31:*.z=01;31:*.dz=01;31:*.gz=01;31:*.lrz=01;31:*.lz=01;31:*.lzo=01;31:*.xz=01;31:*.zst=01;31:*.tzst=01;31:*.bz2=01;31:*.bz=01;31:*.tbz=01;31:*.tbz2=01;31:*.tz=01;31:*.deb=01;31:*.rpm=01;31:*.jar=01;31:*.war=01;31:*.ear=01;31:*.sar=01;31:*.rar=01;31:*.alz=01;31:*.ace=01;31:*.zoo=01;31:*.cpio=01;31:*.7z=01;31:*.rz=01;31:*.cab=01;31:*.wim=01;31:*.swm=01;31:*.dwm=01;31:*.esd=01;31:*.jpg=01;35:*.jpeg=01;35:*.mjpg=01;35:*.mjpeg=01;35:*.gif=01;35:*.bmp=01;35:*.pbm=01;35:*.pgm=01;35:*.ppm=01;35:*.tga=01;35:*.xbm=01;35:*.xpm=01;35:*.tif=01;35:*.tiff=01;35:*.png=01;35:*.svg=01;35:*.svgz=01;35:*.mng=01;35:*.pcx=01;35:*.mov=01;35:*.mpg=01;35:*.mpeg=01;35:*.m2v=01;35:*.mkv=01;35:*.webm=01;35:*.webp=01;35:*.ogm=01;35:*.mp4=01;35:*.m4v=01;35:*.mp4v=01;35:*.vob=01;35:*.qt=01;35:*.nuv=01;35:*.wmv=01;35:*.asf=01;35:*.rm=01;35:*.rmvb=01;35:*.flc=01;35:*.avi=01;35:*.fli=01;35:*.flv=01;35:*.gl=01;35:*.dl=01;35:*.xcf=01;35:*.xwd=01;35:*.yuv=01;35:*.cgm=01;35:*.emf=01;35:*.ogv=01;35:*.ogx=01;35:*.aac=00;36:*.au=00;36:*.flac=00;36:*.m4a=00;36:*.mid=00;36:*.midi=00;36:*.mka=00;36:*.mp3=00;36:*.mpc=00;36:*.ogg=00;36:*.ra=00;36:*.wav=00;36:*.oga=00;36:*.opus=00;36:*.spx=00;36:*.xspf=00;36:ow=01;34:tw=01;34:st=01;34:ex=00'; $g='C:\Program Files\Git\usr\bin\ls.exe'; Remove-Item Alias:ls -Force; function ls { & $g --color=auto -a @args }; function ll { & $g --color=auto -alh @args }; function la { & $g --color=auto -lhA @args }''']

# ---------- Fuente ----------
# En Windows la Nerd Font se registra como "JetBrainsMono NF" (no existe
# "JetBrainsMono Nerd Font"; con ese nombre Alacritty usaba su fuente de reserva).
[font]
size = 16.0

# Más gruesa que la Regular (se veía muy fina): texto normal en SemiBold,
# negrita en ExtraBold para que siga destacando.
[font.normal]
family = "JetBrainsMono NF"
style = "SemiBold"

[font.bold]
family = "JetBrainsMono NF"
style = "ExtraBold"

[font.italic]
family = "JetBrainsMono NF"
style = "SemiBold Italic"

[font.bold_italic]
family = "JetBrainsMono NF"
style = "ExtraBold Italic"

# ---------- Colores ----------
[colors.primary]
foreground = "#ffffff"   # texto blanco (antes #e0e0e0)
background = "#000000"

[colors.cursor]
text = "#000000"
cursor = "#ffffff"

[colors.selection]
text = "#000000"
background = "#b3d7ff"

# color0..color7
[colors.normal]
black   = "#2e2e2e"
red     = "#ff3333"
green   = "#00ff00"
yellow  = "#ffff00"
blue    = "#0f63eb"
magenta = "#e015aa"
cyan    = "#00ffff"
white   = "#d0d0d0"

# color8..color15
[colors.bright]
black   = "#666666"
red     = "#ff6666"
green   = "#33ff33"
yellow  = "#ffff33"
blue    = "#3399ff"
magenta = "#ff33ff"
cyan    = "#33ffff"
white   = "#ffffff"

# ---------- Ventana ----------
[window]
padding = { x = 5, y = 5 }   # window_padding 5
# Marco normal: la barra de título la quita GlazeWM (hide_title_bar), como en
# el resto de ventanas. Con "None", Windows dibujaba un instante el borde al
# cambiar el foco (cada vez que el ratón pasaba por encima, por focus_follows_cursor).
decorations = "Full"
opacity = 1.0                # negro sólido

# ---------- Scroll ----------
[scrolling]
history = 5000

# ---------- Campana ----------
[bell]
duration = 0

# ---------- Cursor y ratón ----------
[cursor.style]
shape = "Block"
blinking = "Never"           # SteadyBlock

[mouse]
hide_when_typing = true

# ---------- Atajos ----------
# Sin pestañas: Ctrl+Shift+N abre una ventana nueva (GlazeWM la coloca).
# (Ctrl+Alt+N no sirve: AutoHotkey lo usa para "siguiente canción".)
[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "CreateNewWindow"
