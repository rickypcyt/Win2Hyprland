# ============================================================
# GLAZEWM — traducción de hyprland.conf
# ============================================================
# Archivo real:  C:\Users\ricar\Win2Hyprland\glzr\glazewm\config.yaml
# (~\.glzr es un junction a Win2Hyprland\glzr)
#
# Recargar en caliente:  glazewm command wm-reload-config
#                        o  Ctrl+Alt+Shift+R
#
# Convención (igual que en Hyprland):
#   LWIN            = apps y acciones de ventana   ($mainMod)
#   ALT             = workspaces                   ($altMod)
#   CTRL+ALT        = multimedia / utilidades (AutoHotkey, ver ahk\hotkeys.ahk)
#   CTRL+ALT+SHIFT  = control de GlazeWM
#
# Rutas en shell-exec: usar barras normales (/) y evitar rutas con
# espacios; GlazeWM falla con comillas + barras invertidas.
# ============================================================

general:
  # Al arrancar: barra (Zebar) + atajos de AutoHotkey.
  # El autotiling (dwindle) lo hace ahk/glaze-bridge.ps1, que lanza hotkeys.ahk.
  # (scripts/autotile.py hacía lo mismo; se quitó para no tener dos a la vez.)
  startup_commands:
    - 'shell-exec zebar'
    - 'shell-exec C:/Users/ricar/Win2Hyprland/ahk/hotkeys.ahk'
  shutdown_commands:
    - 'shell-exec taskkill /IM zebar.exe /F'
  config_reload_commands: []

  # follow_mouse = 1
  focus_follows_cursor: true
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: false
  hide_method: 'cloak'
  show_all_in_taskbar: false


# gaps_in = 5, gaps_out = 10
# (la barra de Zebar reserva sus 35px con dockToEdge, no hace falta sumarlos aquí)
gaps:
  scale_with_dpi: true
  inner_gap: '5px'
  outer_gap:
    top: '10px'
    right: '10px'
    bottom: '10px'
    left: '10px'


# border_size = 0, rounding = 10 (sin transparencia en ventanas inactivas)
# (blur no existe en Windows)
window_effects:
  focused_window:
    border:
      enabled: false
    hide_title_bar:
      enabled: true
    corner_style:
      enabled: true
      style: 'rounded'
    transparency:
      enabled: false

  other_windows:
    border:
      enabled: false
    hide_title_bar:
      enabled: true
    corner_style:
      enabled: true
      style: 'rounded'
    transparency:
      enabled: false


# layout = dwindle → tiling
window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false


# workspace 1 → HDMI-A-1, 2-5 → eDP-1
# bind_to_monitor es el índice de monitor de GlazeWM
# (ver: glazewm query monitors):
#   0 = BenQ externo (BNQ78FA)   1 = pantalla del portátil (NCP002D)
workspaces:
  - name: '1'
    keep_alive: true
    bind_to_monitor: 0
  - name: '2'
    keep_alive: true
    bind_to_monitor: 1
  - name: '3'
    keep_alive: true
    bind_to_monitor: 1
  - name: '4'
    keep_alive: true
    bind_to_monitor: 1
  - name: '5'
    keep_alive: true
    bind_to_monitor: 1
  - name: '6'
  - name: '7'
  - name: '8'
  - name: '9'
  - name: '10'


window_rules:
  - commands: ['ignore']
    match:
      # Barra Zebar (si no, GlazeWM la mete en el mosaico).
      - window_process: { equals: 'zebar' }
      # Picture-in-Picture de navegadores.
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }
      # PowerToys PowerAccent.
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      # Lanzador (Flow Launcher).
      - window_process: { equals: 'Flow.Launcher' }
      # Componentes del shell de Windows.
      - window_process: { equals: 'ShellExperienceHost' }
      - window_process: { equals: 'SearchHost' }
      - window_title: { regex: 'Windows Security' }

  # Diálogos (Abrir/Guardar, etc.) flotando en vez de en mosaico.
  - commands: ['set-floating --centered']
    match:
      - window_class: { regex: '^#32770$' }


keybindings:
  # ----------------------------------------------------------
  # APLICACIONES
  # ----------------------------------------------------------
  # $terminal = kitty  → Alacritty (abre zsh en Arch, en C:/Users/ricar; ver alacritty/alacritty.toml)
  # Ruta 8.3 de C:/Program Files/Alacritty/alacritty.exe: shell-exec falla con espacios.
  - commands: ['shell-exec C:/PROGRA~1/ALACRI~1/ALACRI~1.EXE']
    bindings: ['lwin+enter']

  # $menu = rofi -show drun  → Flow Launcher
  # (lanzar Flow.Launcher.exe con Flow ya abierto muestra su buscador)
  - commands: ['shell-exec C:/Users/ricar/AppData/Local/FlowLauncher/Flow.Launcher.exe']
    bindings: ['lwin+space']

  # $fileManager = thunar  → Explorador
  - commands: ['shell-exec explorer.exe']
    bindings: ['lwin+e']

  # $browser = brave
  - commands: ['shell-exec C:/Users/ricar/AppData/Local/BraveSoftware/Brave-Browser/Application/brave.exe']
    bindings: ['lwin+f']

  # $code = kitty nvim
  - commands: ['shell-exec C:/PROGRA~1/ALACRI~1/ALACRI~1.EXE --working-directory C:/Users/ricar -e nvim']
    bindings: ['lwin+c']

  # kitty nmtui  → ajustes de red / Wi-Fi
  - commands: ['shell-exec ms-settings:network-wifi']
    bindings: ['lwin+n']

  # $obsi = Obsidian
  - commands: ['shell-exec C:/Users/ricar/AppData/Local/Programs/Obsidian/Obsidian.exe']
    bindings: ['lwin+o']

  # $blue = blueman-manager  → ajustes de Bluetooth
  - commands: ['shell-exec ms-settings:bluetooth']
    bindings: ['lwin+b']

  # $pvctrl = pavucontrol  → mezclador de volumen
  - commands: ['shell-exec ms-settings:apps-volume']
    bindings: ['lwin+v']

  # $spoti = spotify
  - commands: ['shell-exec spotify']
    bindings: ['lwin+s']

  # $wasac = zapzap  → WhatsApp
  - commands: ['shell-exec whatsapp:']
    bindings: ['lwin+z']

  # $disco = discord
  - commands: ['shell-exec C:/Users/ricar/AppData/Local/Discord/Update.exe --processStart Discord.exe']
    bindings: ['lwin+shift+d']

  # hyprlock  → bloquear sesión (Win+L de Windows también bloquea)
  - commands: ['shell-exec rundll32.exe user32.dll,LockWorkStation']
    bindings: ['lwin+q']

  # toggle-touchpad.sh  → ajustes del touchpad
  - commands: ['shell-exec ms-settings:devices-touchpad']
    bindings: ['lwin+t']

  # ----------------------------------------------------------
  # GESTIÓN DE VENTANAS
  # ----------------------------------------------------------
  - commands: ['close']
    bindings: ['alt+w']

  - commands: ['toggle-floating --centered']
    bindings: ['lwin+i']

  # Pantalla completa (antes Win+Up)
  - commands: ['toggle-fullscreen']
    bindings: ['lwin+shift+f']

  # Win + flechas (sin Shift): las maneja AutoHotkey -> glaze-bridge.ps1 (swap tipo Hyprland)


  # movewindow l/r/u/d
  - commands: ['move --direction left']
    bindings: ['lwin+shift+left']
  - commands: ['move --direction right']
    bindings: ['lwin+shift+right']
  - commands: ['move --direction up']
    bindings: ['lwin+shift+up']
  - commands: ['move --direction down']
    bindings: ['lwin+shift+down']

  # layout_cycle.sh  → cambiar dirección del mosaico (horizontal/vertical)
  - commands: ['toggle-tiling-direction']
    bindings: ['lwin+m']

  # ----------------------------------------------------------
  # WORKSPACES
  # ----------------------------------------------------------
  # ALT+1..0 (cambiar de workspace) lo maneja AutoHotkey (ahk/hotkeys.ahk)
  # para que pulsarlo muy rápido no se bugee: se queda solo con la última tecla.


  # movetoworkspace (mueve y te lleva, como en Hyprland)
  - commands: ['move --workspace 1', 'focus --workspace 1']
    bindings: ['alt+shift+1']
  - commands: ['move --workspace 2', 'focus --workspace 2']
    bindings: ['alt+shift+2']
  - commands: ['move --workspace 3', 'focus --workspace 3']
    bindings: ['alt+shift+3']
  - commands: ['move --workspace 4', 'focus --workspace 4']
    bindings: ['alt+shift+4']
  - commands: ['move --workspace 5', 'focus --workspace 5']
    bindings: ['alt+shift+5']
  - commands: ['move --workspace 6', 'focus --workspace 6']
    bindings: ['alt+shift+6']
  - commands: ['move --workspace 7', 'focus --workspace 7']
    bindings: ['alt+shift+7']
  - commands: ['move --workspace 8', 'focus --workspace 8']
    bindings: ['alt+shift+8']
  - commands: ['move --workspace 9', 'focus --workspace 9']
    bindings: ['alt+shift+9']
  - commands: ['move --workspace 10', 'focus --workspace 10']
    bindings: ['alt+shift+0']

  # ----------------------------------------------------------
  # MONITORES
  # (Win+L lo reserva Windows para bloquear; no se puede usar)
  # ----------------------------------------------------------
  # $externalmonitor: solo HDMI
  - commands: ['shell-exec DisplaySwitch.exe /external']
    bindings: ['lwin+ctrl+l']
  # $dualmonitor: extender a los dos
  - commands: ['shell-exec DisplaySwitch.exe /extend']
    bindings: ['lwin+shift+l']
  # monitors.sh → selector de pantallas de Windows
  - commands: ['shell-exec DisplaySwitch.exe']
    bindings: ['ctrl+alt+m']

  # ----------------------------------------------------------
  # GLAZEWM
  # ----------------------------------------------------------
  - commands: ['wm-reload-config']
    bindings: ['ctrl+alt+shift+r']
  - commands: ['wm-exit']
    bindings: ['ctrl+alt+shift+e']
  - commands: ['wm-toggle-pause']
    bindings: ['ctrl+alt+shift+space']
