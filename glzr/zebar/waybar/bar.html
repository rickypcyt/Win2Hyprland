<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="bar">
      <div class="left">
        <div class="workspaces" id="workspaces"></div>
        <div class="module tray" id="tray"></div>
        <div class="module media" id="media"></div>
      </div>
      <div class="center">
        <span class="module" id="time"></span>
        <span class="sep">|</span>
        <span class="module" id="date"></span>
        <span class="sep">|</span>
        <span class="module" id="ec" title="Ecuador"></span>
      </div>
      <div class="right">
        <span class="module" id="cpu"></span>
        <span class="module" id="memory"></span>
        <span class="module audio" id="audio"></span>
        <span class="module battery" id="battery"></span>
      </div>
    </div>

    <script type="module">
      import * as zebar from 'https://esm.sh/zebar@3.3.1';

      // Iconos Nerd Font (por código para que no se pierdan al copiar).
      const I = {
        wsDefault: '', //   círculo vacío
        wsActive: '', //   círculo lleno
        spotify: '', //
        paused: '', //
        cpu: '', //
        memory: '', //
        volMuted: '\u{f0581}', // 󰖁
        headphone: '\u{f02cb}', // 󰋋
        vol: ['\u{f057f}', '\u{f0580}', '\u{f057e}'], // 󰕿 󰖀 󰕾
        charging: '\u{f0084}', // 󰂄
        bat: ['\u{f008e}', '\u{f007a}', '\u{f007b}', '\u{f007c}', '\u{f007d}', '\u{f007e}',
              '\u{f007f}', '\u{f0080}', '\u{f0081}', '\u{f0082}', '\u{f0079}'],
      };
      // Puntos dinámicos: solo workspaces con ventanas + el que se está viendo.

      // ---------- conexión directa con GlazeWM ----------
      // El proveedor 'glazewm' de Zebar se queda congelado si se cambia de
      // workspace muy rápido (Alt+1234 4321...). Aquí se habla directamente con
      // el WebSocket IPC de GlazeWM: re-consulta en cada evento (sin acumular
      // consultas), sondeo de seguridad cada 500 ms y reconexión automática.
      const glaze = (() => {
        let sock = null, pendingSince = 0, again = false;
        const listeners = [];
        const open = () => sock && sock.readyState === WebSocket.OPEN;
        function refresh() {
          if (!open()) return;
          if (pendingSince && Date.now() - pendingSince < 2000) { again = true; return; }
          pendingSince = Date.now();
          sock.send('query monitors');
        }
        function connect() {
          sock = new WebSocket('ws://127.0.0.1:6123');
          sock.onopen = () => { pendingSince = 0; sock.send('sub -e all'); refresh(); };
          sock.onmessage = e => {
            let m; try { m = JSON.parse(e.data); } catch { return; }
            if (m.messageType === 'client_response' && m.clientMessage === 'query monitors') {
              pendingSince = 0;
              if (m.success) listeners.forEach(f => f(m.data.monitors));
              if (again) { again = false; refresh(); }
            } else if (m.messageType === 'event_subscription') {
              refresh();
            }
          };
          sock.onclose = () => { pendingSince = 0; setTimeout(connect, 1000); };
          sock.onerror = () => sock.close();
        }
        connect();
        setInterval(refresh, 500);
        return {
          onChange: f => listeners.push(f),
          run: cmd => { if (open()) sock.send('command ' + cmd); },
          isOpen: open,
        };
      })();

      const providers = zebar.createProviderGroup({
        systray: { type: 'systray' },
        media: { type: 'media' },
        time: { type: 'date', formatting: 'HH:mm' },
        date: { type: 'date', formatting: 'ccc, LLL dd', locale: 'en' },
        dateLong: { type: 'date', formatting: 'cccc, dd LLLL yyyy', locale: 'es' },
        ec: { type: 'date', formatting: 'HH:mm', timezone: 'America/Guayaquil' },
        cpu: { type: 'cpu', refreshInterval: 1000 },
        memory: { type: 'memory', refreshInterval: 2000 },
        audio: { type: 'audio' },
        battery: { type: 'battery', refreshInterval: 5000 },
        // Para cuando se usa Komorebi en vez de GlazeWM (scripts/use-komorebi.ps1)
        komorebi: { type: 'komorebi' },
      });

      const $ = id => document.getElementById(id);
      const settings = uri => zebar.shellExec('explorer', uri).catch(() => {});

      // ---------- workspaces (persistentes 1-5, como en Waybar) ----------
      // Monitor en el que está esta barra (por posición de la ventana).
      function myMonitor(monitors) {
        const x = window.screenX + 5, y = window.screenY + 5;
        return monitors.find(m => x >= m.x && x < m.x + m.width && y >= m.y && y < m.y + m.height)
          ?? monitors.find(m => m.hasFocus) ?? monitors[0];
      }

      let wsKey = '';
      // Pinta los puntos: busyNames = workspaces con ventanas, activeName = el visible
      // (se muestra aunque esté vacío), go(name) = cómo cambiar a él (GlazeWM o Komorebi).
      function drawWorkspaces(busyNames, activeName, go) {
        const el = $('workspaces');
        const names = [...new Set([...busyNames, ...(activeName ? [activeName] : [])])]
          .sort((a, b) => Number(a) - Number(b));
        const key = names.join() + '|' + activeName;
        if (key === wsKey) return; // nada cambió: no tocar el DOM
        wsKey = key;
        el.replaceChildren(...names.map(name => {
          const active = name === activeName;
          const b = document.createElement('button');
          b.className = active ? 'active' : '';
          b.textContent = active ? I.wsActive : I.wsDefault;
          b.title = `Workspace ${name}`;
          b.onclick = () => go(name);
          return b;
        }));
      }

      function renderWorkspaces(monitors) {
        const mine = myMonitor(monitors);
        const all = monitors.flatMap(m => m.children.filter(c => c.type === 'workspace'));
        // activo = el workspace que se ve en ESTE monitor
        const activeName = mine?.children.find(w => w.isDisplayed)?.name;
        const hasWindows = c => c.type === 'window' || (c.children ?? []).some(hasWindows);
        const busy = all.filter(hasWindows).map(w => w.name);
        drawWorkspaces(busy, activeName, name => glaze.run(`focus --workspace ${name}`));
      }

      // Con Komorebi (GlazeWM apagado): mismos puntos, datos del proveedor de Zebar.
      function renderKomorebi(k) {
        if (!k || glaze.isOpen()) return;
        const busy = k.allWorkspaces
          .filter(w => w.name && (w.tilingContainers.length || w.floatingWindows.length || w.monocleContainer || w.maximizedWindow))
          .map(w => w.name);
        drawWorkspaces(busy, k.displayedWorkspace?.name, name =>
          zebar.shellExec('C:\\Program Files\\komorebi\\bin\\komorebic-no-console.exe', ['focus-named-workspace', name]).catch(() => {}));
      }
      renderWorkspaces([]);
      glaze.onChange(renderWorkspaces);

      // ---------- tray ----------
      let trayHash = '';
      function renderTray(tray) {
        const el = $('tray');
        if (!tray) return;
        const hash = tray.icons.map(i => i.id + i.iconHash).join();
        if (hash === trayHash) return;
        trayHash = hash;
        el.replaceChildren(...tray.icons.map(icon => {
          const img = document.createElement('img');
          img.src = icon.iconUrl;
          img.title = icon.tooltip;
          img.onclick = e => { e.preventDefault(); tray.onLeftClick(icon.id); };
          img.oncontextmenu = e => { e.preventDefault(); tray.onRightClick(icon.id); };
          img.onauxclick = e => { if (e.button === 1) tray.onMiddleClick(icon.id); };
          img.onmouseenter = () => tray.onHoverEnter(icon.id);
          img.onmouseleave = () => tray.onHoverLeave(icon.id);
          return img;
        }));
        el.style.display = tray.icons.length ? '' : 'none';
      }

      // ---------- mpris (Spotify) ----------
      function renderMedia(media) {
        const el = $('media');
        const s = media?.currentSession;
        if (!s || !s.title) { el.style.display = 'none'; return; }
        el.style.display = '';
        el.className = 'module media' + (s.isPlaying ? '' : ' paused');
        const text = [s.artist, s.title].filter(Boolean).join(' - ');
        el.innerHTML = '';
        el.append((s.isPlaying ? I.spotify : I.paused) + ' ');
        const t = document.createElement('span');
        t.className = 'title';
        t.textContent = text;
        el.append(t);
        el.title = `${s.artist ?? ''} - ${s.title}\n${s.albumTitle ?? ''}`;
        el.onclick = () => media.togglePlayPause();
        el.onauxclick = e => { if (e.button === 1) media.next(); };
        el.oncontextmenu = e => { e.preventDefault(); media.previous(); };
      }

      // ---------- audio ----------
      function renderAudio(audio) {
        const el = $('audio');
        const d = audio?.defaultPlaybackDevice;
        if (!d) { el.style.display = 'none'; return; }
        el.style.display = '';
        const vol = Math.round(d.volume);
        const isHeadphone = /auricular|headphone|headset|buds/i.test(d.name);
        const icon = d.isMuted ? I.volMuted
          : isHeadphone ? I.headphone
          : I.vol[Math.min(2, Math.floor(vol / 34))];
        el.classList.toggle('muted', d.isMuted);
        el.textContent = d.isMuted ? `${I.volMuted} muted` : `${icon} ${vol}%`;
        el.title = d.name;
      }
      $('audio').onclick = () => settings('ms-settings:apps-volume');
      $('audio').oncontextmenu = e => {
        e.preventDefault();
        const d = providers.outputMap.audio?.defaultPlaybackDevice;
        if (d) providers.outputMap.audio.setMute(!d.isMuted);
      };
      $('audio').onwheel = e => {
        const a = providers.outputMap.audio;
        const d = a?.defaultPlaybackDevice;
        if (!d) return;
        const v = Math.max(0, Math.min(100, Math.round(d.volume) + (e.deltaY < 0 ? 5 : -5)));
        a.setVolume(v);
      };

      // ---------- batería ----------
      function renderBattery(b) {
        const el = $('battery');
        if (!b) { el.style.display = 'none'; return; }
        el.style.display = '';
        const c = Math.round(b.chargePercent);
        const state = c >= 95 ? 'full' : c <= 20 ? 'critical' : c <= 30 ? 'warning' : 'good';
        el.className = `module battery ${state}`;
        const icon = b.isCharging || b.state === 'full'
          ? I.charging
          : I.bat[Math.min(10, Math.floor(c / 10))];
        el.textContent = `${icon} ${c}%`;
        const mins = b.isCharging ? b.timeTillFull : b.timeTillEmpty;
        el.title = mins ? `${Math.floor(mins / 3600000)}h ${Math.round((mins % 3600000) / 60000)}min` : '';
      }
      $('battery').onclick = () => settings('ms-settings:batterysaver');

      function render() {
        const o = providers.outputMap;
        renderTray(o.systray);
        renderKomorebi(o.komorebi);
        renderMedia(o.media);

        $('time').textContent = o.time?.formatted ?? '';
        $('date').textContent = o.date?.formatted ?? '';
        $('date').title = o.dateLong?.formatted ?? '';
        $('ec').textContent = o.ec?.formatted ?? '';

        if (o.cpu) $('cpu').textContent = `${I.cpu}  ${Math.round(o.cpu.usage)}%`;
        if (o.memory) $('memory').textContent = `${I.memory}  ${(o.memory.usedMemory / 1024 ** 3).toFixed(1)} GB`;
        renderAudio(o.audio);
        renderBattery(o.battery);
      }

      providers.onOutput(render);
      render();
    </script>
  </body>
</html>
