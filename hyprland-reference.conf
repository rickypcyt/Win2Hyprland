# Config original de Hyprland (Linux). Solo referencia: NO la lee nada en Windows.

env = __NV_PRIME_RENDER_OFFLOAD,1
env = __VK_LAYER_NV_optimus,NVIDIA_only
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

monitor = eDP-1,1920x1080@60,0x0,1
monitor = HDMI-A-1,1920x1080@100,1920x0,1

workspace = 1, monitor:HDMI-A-1
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1

$mainMod = SUPER
$altMod  = ALT

$terminal    = kitty
$fileManager = thunar
$menu        = rofi -show drun
$browser     = brave
$code        = kitty nvim
$nvim        = kitty nvim

$disco   = discord
$wasac   = zapzap
$spoti   = spotify
$obsi    = flatpak run --socket=wayland md.obsidian.Obsidian
$pdfs    = evince
$blue    = blueman-manager
$pvctrl  = pavucontrol

$externalmonitor = extonly
$dualmonitor     = bothmons

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = waybar
exec-once = swayosd-server
exec-once = nm-applet
exec-once = sudo rog-control-center
exec-once = sudo slimbookbattery
exec-once = swaybg -i /home/ricky/Documents/Walls/ogwall5dim.jpg

general {
    gaps_in  = 5
    gaps_out = 10
    border_size = 0
    col.active_border   = rgba(333333ff)
    col.inactive_border = rgba(00000000)
    resize_on_border = true
    allow_tearing    = true
    layout           = dwindle
    no_focus_fallback = true
}

decoration {
    rounding         = 10
    active_opacity   = 1
    inactive_opacity = 0.9
    fullscreen_opacity = 1.0
    blur {
        enabled           = true
        size              = 3
        passes            = 2
        vibrancy          = 0.1696
        contrast          = 1.0
        brightness        = 1.0
        noise             = 0.0117
        new_optimizations = true
    }
}

animations {
    enabled = false
}

input {
    kb_layout  = us
    kb_variant = intl
    follow_mouse = 1
    sensitivity  = 0
    touchpad {
        disable_while_typing = true
    }
}

# APLICACIONES
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, SPACE,  exec, $menu
bind = $mainMod, E,      exec, $fileManager
bind = $mainMod, F,      exec, $browser
bind = $mainMod, C,      exec, $code
bind = $mainMod, N,      exec, kitty nmtui
bind = $mainMod, O,      exec, $obsi
bind = $mainMod, D,      exec, $pdfs
bind = $mainMod, B,      exec, $blue
bind = $mainMod, V,      exec, $pvctrl
bind = $mainMod, S,      exec, $spoti
bind = $mainMod, Z,      exec, $wasac
bind = $mainMod, Q,      exec, hyprlock

# VENTANAS
bind = $mainMod,       W,     killactive
bind = $mainMod,       I,     togglefloating
bind = $mainMod,       up,    fullscreen
bind = $mainMod,       left,  swapwindow, l
bind = $mainMod,       right, swapwindow, r
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# WORKSPACES: ALT+1..0 cambiar, ALT+SHIFT+1..0 mover ventana
bind = $altMod,       1, workspace, 1
# ... (2-10 igual)
bind = $altMod SHIFT, 1, movetoworkspace, 1
# ... (2-10 igual)

# MONITORES
bind = $mainMod,       L, exec, hyprctl keyword monitor "eDP-1,disable" && hyprctl keyword monitor "HDMI-A-1,1920x1080@100.00,0x0,1"
bind = $mainMod SHIFT, L, exec, hyprctl keyword monitor "eDP-1,1920x1080@59.93,0x0,1" && hyprctl keyword monitor "HDMI-A-1,1920x1080@100.00,1920x0,1"
bind = CTRL ALT,       M, exec, ~/.config/hypr/scripts/monitors.sh

# MULTIMEDIA
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume +5 --max-volume 200
bind = , XF86AudioLowerVolume, exec, swayosd-client --output-volume -5
bind = , XF86AudioMute,        exec, pamixer -t
bind = , XF86AudioMicMute,     exec, pamixer --default-source -m
bind = CTRL ALT, P, exec, ~/.config/hypr/scripts/media_toggle.sh
bind = CTRL ALT, N, exec, playerctl next
bind = CTRL ALT, V, exec, ~/.config/hypr/scripts/get-next-sink.sh

# BRILLO
bind = , XF86MonBrightnessUp,   exec, swayosd-client --brightness +5
bind = , XF86MonBrightnessDown, exec, swayosd-client --brightness -5
bind = CTRL ALT, bracketright, exec, swayosd-client --brightness +5
bind = CTRL ALT, bracketleft,  exec, swayosd-client --brightness -5
bind = CTRL ALT, ',            exec, swayosd-client --brightness +5
bind = CTRL ALT, ;,            exec, swayosd-client --brightness -5
bind = CTRL ALT, 0, exec, ~/.config/hypr/scripts/hyprsunset_toggle.sh

# CAPTURAS
bind = CTRL ALT, u, exec, grim -g "$(slurp -d)" - | wl-copy && notify-send "Screenshot Copied to Clipboard"
bind = $mainMod, Print, exec, grim - | wl-copy && notify-send "Full Screenshot Copied"

# UTILIDADES
bind = $mainMod,       P, exec, ~/.config/hypr/scripts/toggle_waybar.sh
bind = $mainMod,       T, exec, ~/.config/hypr/scripts/toggle-touchpad.sh
bind = $mainMod,       M, exec, ~/.config/hypr/scripts/layout_cycle.sh
bind = $mainMod SHIFT, M, layoutmsg, cyclenext
bind = CTRL ALT,       B, exec, ~/.config/hypr/scripts/toggle_powerprofile.sh
bind = $mainMod, ESCAPE, exec, ~/.config/hypr/scripts/powermenu.sh
